# MorasFlow.si default settings. Restart the app after changing settings. API keys go in .env, never here.
# To change a setting, put it in config.local.yaml next to this file (same layout, only what you change, e.g.
#   logo: logo.png
#   cleanup:
#     backend: anthropic
# ). That file is yours: git ignores it and updates leave it alone.

# Any image (cut to a circle; non-square images are centre-cropped), relative to this folder.
# Bundled: logo-mic.png or logo.png (Moras's avatar). After changing it, run setup.bat again for the desktop icon.
logo: logo-mic.png

# ctrl+windows = hold Ctrl and the Win key. Any keyboard-library name works, e.g. ctrl+shift+space.
hotkey: ctrl+windows
mode: push_to_talk          # push_to_talk (hold to record) | toggle (press to start, press again to stop)

transcription:
  # groq: ~0.5 s per clip and more accurate, but audio goes to Groq; if it fails, local Whisper takes over.
  # local: keeps audio on this laptop, ~2.8 s per 10 s clip.
  backend: groq             # local | groq | openai
  # Blank = the backend's default: groq whisper-large-v3-turbo, openai whisper-1, local small.en
  # (or base.en: ~1.1 s, less accurate). If you set one, it must suit the backend.
  model:
  device: auto              # auto | cpu | cuda (local only)

cleanup:
  enabled: true
  # groq has a free tier (no card) with daily limits; over the limit, the raw transcript is pasted.
  backend: groq             # anthropic | openai | groq | ollama
  # Blank = the backend's default: groq openai/gpt-oss-120b (or openai/gpt-oss-20b; Llama models aren't
  # available on every Groq account), anthropic claude-opus-5-5 (claude-haiku-4-5 is faster),
  # openai gpt-4.1-mini, ollama llama3.2. If you set one, it must suit the backend.
  model:
  timeout_seconds: 5

default_mode: Default       # Default | Email | Slack/Teams | Notes | Raw

history:
  enabled: true
  path: history.jsonl       # relative to this folder
  open_on_start: true       # open the live history window when the app starts

beeps:
  enabled: true
